name = "reu-brief"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Your GitHub Pages origin, e.g. https://yourname.github.io  (no trailing slash, no path)
ALLOWED_ORIGIN = "https://abinav-ts.github.io"
# Filled in after the smoke test. MODEL_PUBLIC is a comma-separated fallback list.
MODEL_PUBLIC = "gemini-3.1-flash-lite,gemini-3.5-flash-lite"
MODEL_PRIVATE = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
FIRECRAWL_MONTHLY_CAP = "900"
# "false" = anyone with the page can search (rate limit + credit cap still apply). Set "true" to require the demo key again.
REQUIRE_DEMO_KEY = "false"

# Cloudflare Workers AI (private lane for CV/match)
[ai]
binding = "AI"

# Response cache (created with `npx wrangler kv namespace create CACHE`).
[[kv_namespaces]]
binding = "CACHE"
id = "3bc55494d6814942bca87a7f4ebdad89"
